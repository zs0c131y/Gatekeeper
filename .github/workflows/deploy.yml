name: Deploy to Fly.io

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
        
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }}
        env:
          FLY_API_TOKEN: ${{ secrets.fly_token }}
