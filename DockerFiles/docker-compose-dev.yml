services:
  mongodb:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  frontend:
    build:
      context: ..
      dockerfile: DockerFiles/Dev/frontend.Dockerfile
    image: frontend:dev
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules

  backend:
    build:
      context: ..
      dockerfile: DockerFiles/Dev/backend.Dockerfile
    image: backend:dev
    ports:
      - "9000:9000"
    volumes:
      - ../backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - ./Env/backend.env
    depends_on:
      - mongodb
      - redis
      - temp
      - temp-2

  temp:
    build:
      context: ../temp_servers
      dockerfile: ../DockerFiles/Dev/temp.dockerfile
    image: temp-1:dev
    ports:
      - "4000:3000"

  temp-2:
    build:
      context: ../temp_servers
      dockerfile: ../DockerFiles/Dev/temp.dockerfile
    image: temp-2:dev
    ports:
      - "4001:3000"

volumes:
  mongo_data:
  redis_data:
  backend_node_modules:
  frontend_node_modules:
