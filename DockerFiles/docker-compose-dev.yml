services:
  frontend:
    build:
      context: ..
      dockerfile: DockerFiles/Dev/frontend.Dockerfile
    image: frontend:dev
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules

  backend:
    build:
      context: ..
      dockerfile: DockerFiles/Dev/backend.Dockerfile
    image: backend:dev
    ports:
      - "9000:9000"
    volumes:
      - ../backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - ./Env/backend.env
  
  temp:
    build:
      context: ../temp_servers
      dockerfile: ../DockerFiles/Dev/temp.dockerfile
    image: temp-1:dev
    ports:
      - "4000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  temp-2:
    build:
      context: ../temp_servers
      dockerfile: ../DockerFiles/Dev/temp.dockerfile
    image: temp-2:dev
    ports:
      - "4001:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001"]
      interval: 10s
      timeout: 5s 
      retries: 5
    

volumes:
  backend_node_modules:
  frontend_node_modules:
